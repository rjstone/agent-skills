name: ci

# Pushes to main and to new-skill branches, and every PR (opened, pushed to,
# reopened). update/* branches are tested through their PR, so they are not
# listed under push (that would run CI twice per push).
on:
  push:
    branches: [main, "skill/**"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the diff against the base needs history

      - name: Choose skills to test (changed ones only)
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base=$PR_BASE
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base=$BEFORE
          else
            # first push of a branch, or a manual run: compare with main
            base=$(git merge-base origin/main HEAD)
          fi
          # versions: judged against main, so only skills already on main need a
          # bump (a push to main itself compares with the commit before it)
          if [ "$EVENT" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            vbase=$base
          else
            vbase=$(git merge-base origin/main HEAD)
          fi
          echo "Comparing $base..HEAD (versions against $vbase)"
          python3 scripts/ci_changed_skills.py --base "$base" --version-base "$vbase" --check-versions

      - name: Repo-wide safety scan (always; fast)
        run: python3 -m unittest tests.test_public_safety -v

      - name: Unit tests for the chosen skills
        if: steps.pick.outputs.any == 'true'
        env:
          SKILLS: ${{ steps.pick.outputs.skills }}
        run: python3 -m unittest discover -s tests -v

      - uses: actions/setup-node@v7
        if: steps.pick.outputs.any == 'true'
        with:
          node-version: 22 # skills CLI needs Node 22.20+

      - name: skills.sh discovers the chosen skills
        if: steps.pick.outputs.any == 'true'
        env:
          DISABLE_TELEMETRY: "1"
          DO_NOT_TRACK: "1"
          SKILLS: ${{ steps.pick.outputs.skills }}
        run: |
          out=$(npx -y skills add . --list 2>&1)
          echo "$out"
          if [ "$SKILLS" = all ]; then
            names=$(for d in skills/*/; do basename "$d"; done)
          else
            names=$(tr ',' '\n' <<<"$SKILLS")
          fi
          missing=0
          for name in $names; do
            if ! grep -q -- "$name" <<<"$out"; then
              echo "::error::skills CLI did not list $name"
              missing=1
            fi
          done
          exit $missing

  skills-index:
    # Keep skills/index.json (the opencode HTTP skill catalog, served from
    # raw.githubusercontent.com) in step with skills/ on main. Works only when
    # skills/ changed, the file is missing, or it is stale (e.g. an earlier
    # run was cancelled); commits only a real change. Pushes made with
    # GITHUB_TOKEN do not start another workflow run.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Regenerate and commit skills/index.json if needed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          changed=0
          if [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ] \
             && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            git diff --name-only "$BEFORE" HEAD -- skills/ | grep -qv '^skills/index.json$' && changed=1
          else
            changed=1
          fi
          if [ "$changed" = 0 ] && [ -f skills/index.json ] \
             && python3 scripts/build_skills_index.py --check; then
            echo "No skill changes and the index is current; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            python3 scripts/build_skills_index.py
            git add skills/index.json
            if git diff --cached --quiet; then
              echo "skills/index.json already up to date."
              exit 0
            fi
            git commit -q -m "chore: regenerate skills/index.json"
            git push origin HEAD:main && exit 0
            # main moved: start again from the new main (never force-push)
            git fetch -q origin main
            git reset -q --hard origin/main
          done
          echo "::error::could not push skills/index.json after 3 attempts"
          exit 1
