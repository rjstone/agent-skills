# Bandit: Python security linter. Results go to the Security tab as SARIF.
#
# Two scans, because Bandit's own config can't scope a skip to one folder:
#   - the code (everything except tests/): all checks
#   - tests/: skips B105 (hardcoded password; trips on fixture prices under
#     *_cost_per_token keys) and B603 (subprocess without shell; the tests run
#     our own scripts with fixed argument lists). The user, 2026-11-18.
# Same commands locally (needs `pip install "bandit[sarif]"`):
#   bandit -r . -x ./tests -f sarif -o bandit-code.sarif --exit-zero
#   bandit -r tests -s B105,B603 -f sarif -o bandit-tests.sarif --exit-zero

name: Bandit
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '25 12 * * 1'

jobs:
  bandit:
    permissions:
      contents: read          # actions/checkout
      security-events: write  # upload-sarif
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Bandit
        run: pip install "bandit[sarif]==1.9.4"
      - name: Scan code (all checks)
        run: bandit -r . -x ./tests -f sarif -o bandit-code.sarif --exit-zero
      - name: Scan tests (skip B105, B603)
        run: bandit -r tests -s B105,B603 -f sarif -o bandit-tests.sarif --exit-zero
      - name: Upload code results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit-code.sarif
          category: bandit-code
      - name: Upload tests results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit-tests.sarif
          category: bandit-tests
