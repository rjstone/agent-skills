# SkillSpector baseline for skills/opencode-cli (accepted findings).
# Used by scripts/skillspector_ci.py (CI: .github/workflows/skillspector.yml).
# Glob rules match rule id, a path relative to the skill folder, and an
# optional message glob (the finding text). Every rule needs a reason.
# Accept only findings you checked in context; scope AE1 (coverage gap)
# rules to one file so a new gap still fails CI. Format: upstream
# docs/SUPPRESSION.md.
version: 2
rules:
  - id: "AE1"
    path: "SKILL.md"
    message: "*references/config.md (partial)*"
    reason: "Coverage gap: SkillSpector's bounded static parser (tool-misuse analyzer) stops on long expressions in this file; scanner limit, not a finding in the file"
  - id: "AE1"
    path: "SKILL.md"
    message: "*references/keybinds.md (partial)*"
    reason: "Coverage gap: SkillSpector's bounded static parser (tool-misuse analyzer) stops on long expressions in this file; scanner limit, not a finding in the file"
  - id: "AS2"
    path: "references/keybinds.md"
    reason: "Vendored upstream docs (references/ is downloaded, never hand-edited): UI action text 'List MCP servers'"
  - id: "PE3"
    path: "references/commands.md"
    reason: "Vendored upstream docs (references/ is downloaded, never hand-edited): documents `opencode auth export/import credentials.json`, the CLI's own credential backup commands"
