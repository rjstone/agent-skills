# SkillSpector baseline for skills/opencode-api (accepted findings).
# Used by scripts/skillspector_ci.py (CI: .github/workflows/skillspector.yml).
# Glob rules match rule id, a path relative to the skill folder, and an
# optional message glob (the finding text). Every rule needs a reason.
# Accept only findings you checked in context; scope AE1 (coverage gap)
# rules to one file so a new gap still fails CI. Format: upstream
# docs/SUPPRESSION.md.
version: 2
rules:
  - id: "AE1"
    path: "SKILL.md"
    message: "*references/openapi.json (partial)*"
    reason: "Coverage gap: SkillSpector's bounded static parser (tool-misuse analyzer) stops on long expressions in this file; scanner limit, not a finding in the file (vendored OpenAPI spec)"
  - id: "AS2"
    path: "references/openapi.json"
    reason: "Vendored upstream docs (references/ is downloaded, never hand-edited): the opencode server's /mcp endpoint description 'List MCP servers', not an access to MCP config"
